events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------
    # FIX 1: WebSocket Support (Required for Next.js HMR)
    # ------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
                server_name joblyAI-local.com;

        # ------------------------------------
        # 1. FRONTEND (Next.js / React)
        # ------------------------------------
        location / {
            # Local dev Next.js on host (macOS):
            proxy_pass http://host.docker.internal:5173;

            # Standard Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL for Next.js: Enable WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ------------------------------------
        # 2. BACKEND API
        # ------------------------------------
        location /api/ {
            # --------------------------------------------------------
            # CHOOSE YOUR BACKEND (Uncomment ONE):
            # --------------------------------------------------------

            # OPTION A: Backend is running in a Docker container named 'backend'
                    proxy_pass http://backend:3000/;

            # OPTION B: Backend is running on your Host Machine (Terminal)
            # NOTE: Requires 'host.docker.internal' setup (see below)
            # proxy_pass http://host.docker.internal:8080/;

            # --------------------------------------------------------
            # PATH REWRITING EXPLAINED:
            # The trailing slash '/' at the end of the proxy_pass URL 
            # tells Nginx to STRIP '/api/' from the request.
            #
            # Request: http://joblyAI-local.com/api/users
            # Becomes: http://backend:3000/users
            # --------------------------------------------------------

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}