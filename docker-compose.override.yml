services:
  backend:
    # Dev: install deps inside the container (bind mount hides built node_modules) then run watch mode
    command: sh -c "pnpm install --force && pnpm nx serve backend --host=0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NX_DAEMON: "true"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
      - "9229:9229"