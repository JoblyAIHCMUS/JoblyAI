services:
  backend:
    # Dev: Use cached node_modules and pnpm store for fast startup with hot reload
    user: 'root'
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: base
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm --filter @jobly/backend exec prisma generate && pnpm --filter @jobly/backend exec prisma migrate dev && cd /app/apps/backend && pnpm run start:dev"
    volumes:
      - .:/app
      - /app/apps/backend/node_modules
      - backend_node_modules:/app/node_modules
      - backend_pnpm_store:/app/.pnpm-store
      - backend_pnpm_cache:/home/node/.cache/pnpm
    environment:
      CI: 'true'
      CHOKIDAR_USEPOLLING: '1'
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
      REDIS_URL: redis://redis:6379
      HOME: /home/node
      PNPM_HOME: '/home/node/.local/share/pnpm'
      PNPM_STORE_DIR: '/app/.pnpm-store'
    tmpfs:
      - /tmp
    ports:
      - '3000:3000'
      - '9229:9229'
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  backend_node_modules:
  backend_pnpm_store:
  backend_pnpm_cache:
