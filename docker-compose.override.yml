services:
  backend:
    # Dev: Use cached node_modules and pnpm store for fast startup with hot reload
    user: "1000:1000"
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @jobly/backend exec prisma generate && pnpm --filter @jobly/backend exec prisma migrate dev && cd /app/apps/backend && pnpm run start:dev"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
      - backend_pnpm_store:/home/node/.local/share/pnpm/store
      - backend_pnpm_cache:/home/node/.cache/pnpm
    environment:
      CI: "true"
      CHOKIDAR_USEPOLLING: "1"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      REDIS_URL: redis://redis:6379
      HOME: /home/node
    tmpfs:
      - /tmp
    ports:
      - "3000:3000"
      - "9229:9229"

volumes:
  backend_node_modules:
  backend_dist:
  backend_pnpm_store:
  backend_pnpm_cache: