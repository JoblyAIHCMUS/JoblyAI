services:
  backend:
    # 🟢 Run NestJS in Watch Mode on Port 3000
    command: pnpm nx serve backend --host=0.0.0.0 --port=3000
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    # Open debug port for VS Code (Optional)
    ports:
      - "3000:3000"
      - "9229:9229"

  web:
    # 🟢 Run Next.js in Watch Mode on Port 5050
    command: pnpm nx serve web --host=0.0.0.0 --port=5050
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      # Polling ensures Docker sees file changes on Mac/Windows
      WATCHPACK_POLLING: "true"