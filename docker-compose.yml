services:
  # --- INFRASTRUCTURE ---
  postgres:
    # Use pgvector official image for vector similarity search
    image: pgvector/pgvector:pg17
    container_name: postgres_jobly
    environment:
      POSTGRES_USER: jobly
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jobly}
      POSTGRES_DB: jobly_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - local-db

  redis:
    image: redis:7-alpine
    container_name: redis_jobly
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  scylla:
    image: scylladb/scylla:5.4
    container_name: scylla_jobly
    ports:
      - '9042:9042'
    volumes:
      - scylla_data:/var/lib/scylla
      - ./apps/backend/scylladb/schema.cql:/docker-entrypoint-initdb.d/schema.cql
    command: --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  scylla-init:
    image: scylladb/scylla:5.4
    container_name: scylla_init_jobly
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./apps/backend/scylladb/schema.cql:/schema.cql
    entrypoint: sh
    command: ['-c', 'cqlsh scylla -f /schema.cql && exit 0']
    restart: on-failure

  # --- APPLICATIONS ---
  backend:
    container_name: backend_jobly
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    ports:
      - '3000:3000'
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy
      scylla:
        condition: service_healthy

  web:
    container_name: web_jobly
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://jobly.ai.vn}
    env_file:
      - apps/backend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://jobly.ai.vn}
    ports:
      - '3001:3001'
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_jobly
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  scylla_data:
