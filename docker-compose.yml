services:
  # --- INFRASTRUCTURE ---
  postgres:
    # Pinned to Postgres 17 (current stable major).
    image: postgres:17-alpine
    container_name: postgres_jobly
    environment:
      POSTGRES_USER: jobly
      POSTGRES_PASSWORD: jobly
      POSTGRES_DB: jobly_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobly -d jobly_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pinned to Redis 7 (current stable major).
    image: redis:7-alpine
    container_name: redis_jobly
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scylla:
    # Pinned to ScyllaDB 5.4 LTS for stability.
    image: scylladb/scylla:5.4
    container_name: scylla_jobly
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    # Scylla needs more generous timeouts
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/$(hostname -i)/9042'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  minio:
    # Unpinned MinIO tag; update intentionally when upgrading.
    image: minio/minio:latest
    container_name: minio_jobly
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: jobly
      MINIO_ROOT_PASSWORD: jobly123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APPLICATIONS ---
  backend:
    user: root
    container_name: backend_jobly
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Add Scylla dependency if your app connects on startup
      scylla:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobly:jobly@postgres:5432/jobly_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter @jobly/backend exec prisma migrate deploy && node dist/main"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    # Pinned to nginx 1.27.x for stability.
    image: nginx:1.27-alpine
    container_name: nginx_jobly
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  scylla_data:
  minio_data: