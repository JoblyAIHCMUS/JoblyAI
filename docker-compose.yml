services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobly        # <--- Updated Username
      POSTGRES_PASSWORD: jobly    # <--- Updated Password
      POSTGRES_DB: jobly_db       # Default database name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobly -d jobly_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  logto:
    image: ghcr.io/logto-io/logto:latest
    container_name: jobly_logto
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://jobly:jobly@postgres:5432/jobly_db
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        npm run cli db seed -- --swe
        npm start

  # --- APPLICATIONS ---
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobly:jobly@postgres:5432/jobly_db
      NODE_ENV: production
    command: ["node", "dist/main"]

  # --- WEB FRONTEND ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jobly_web
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      PORT: 5173
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data: