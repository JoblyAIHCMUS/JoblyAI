services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres_jobly
    environment:
      POSTGRES_USER: jobly        # <--- Updated Username
      POSTGRES_PASSWORD: jobly    # <--- Updated Password
      POSTGRES_DB: jobly_db       # Default database name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobly -d jobly_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_jobly
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APPLICATIONS ---
  backend:
    user: root
    container_name: backend_jobly
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobly:jobly@postgres:5432/jobly_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: ["sh", "-c", "pnpm --filter @jobly/backend exec prisma migrate deploy && node dist/main"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
      image: nginx:alpine
      container_name: nginx_jobly
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - backend
volumes:
  postgres_data:
  redis_data: