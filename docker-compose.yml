services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobly # <--- Updated Username
      POSTGRES_PASSWORD: jobly # <--- Updated Password
      POSTGRES_DB: jobly_db # Default database name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobly -d jobly_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobly_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APPLICATIONS ---
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    env_file:
      - apps/backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobly:jobly@postgres:5432/jobly_db
      NODE_ENV: development
    command: >
      sh -c "pnpm install --frozen-lockfile && 
             npx prisma generate --schema apps/backend/prisma/schema.prisma && 
             pnpm exec nx run @jobly/backend:serve"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - .:/app # Sync your code live
      - /app/node_modules # PROTECT root dependencies
      - /app/apps/backend/node_modules # PROTECT backend dependencies

volumes:
  postgres_data:
  redis_data:
