services:
  backend:
    # Dev: install deps inside the container (bind mount hides built node_modules) then run watch mode
    command: sh -c "pnpm install && pnpm nx serve backend --host=0.0.0.0 --port=3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
      - "9229:9229"

  web:
    # Dev: Next.js in watch mode
    command: sh -c "pnpm install && pnpm nx serve web --host=0.0.0.0 --port=5050"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "5050:5050"
