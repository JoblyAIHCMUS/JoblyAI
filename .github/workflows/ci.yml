name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_BRANCH: ${{ github.head_ref || github.ref_name }}
      NX_RUN_GROUP: ${{ github.run_id }}
    steps:
      # 1. Checkout Code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Nx 'affected' to work

      # 2. Install PNPM (The correct package manager)
      - uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      # 3. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Install Dependencies
      - run: pnpm install --frozen-lockfile

      # 4b. Restore Nx cache to speed up repeated CI runs
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nx-

      # 5. Initialize Nx Logic (Calculates what changed)
      - uses: nrwl/nx-set-shas@v4

      # 6. Run Formatting Check
      - run: pnpm nx format:check

      # 7. Run Tasks (Lint, Test, Build)
      # using 'affected' so we don't re-test the whole repo every time
      - run: pnpm nx affected -t lint test build