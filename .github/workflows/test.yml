name: Backend-Tests Pipeline

on:
  push:
    branches:
      - main
      - development
      - "**/backend/**"
    paths: 
      - 'apps/backend/**'
      - 'libs/**'
  pull_request:
    branches:
      - main
      - development
      - "**/backend/**"
    paths: 
      - 'apps/backend/**'
      - 'libs/**'

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Setup PNPM (Version 9 required)
      - uses: pnpm/action-setup@v2
        with:
          version: 9

      # 2. Setup Node (Version 22 required)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile

      # 4. Initialize Nx
      - uses: nrwl/nx-set-shas@v4

      # 5. Run Backend Tests (Only on affected projects)
      - run: pnpm nx affected -t test --projects=apps/backend

      # 6. Upload Vitest Coverage Report
      - name: Upload Vitest Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-coverage
          path: apps/backend/coverage

      # 7. Archive Vitest Coverage Report
      - name: Archive Vitest Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-coverage-archive
          path: apps/backend/coverage/**/*