name: Deploy Backend JoblyAI to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            # 1. Chuyển về thư mục home
            cd $HOME
            
            # 2. Sao lưu file .env nếu tồn tại để tránh bị mất khi xóa thư mục
            if [ -f "joblyai/apps/backend/.env" ]; then
              echo "--- Đang sao lưu file .env ---"
              cp "joblyai/apps/backend/.env" "$HOME/backend_env_backup"
            fi
            
            # 3. Xóa và Clone lại nếu thư mục bị lỗi hoặc không có .git
            if [ ! -d "joblyai/.git" ]; then
              echo "--- Thư mục lỗi hoặc chưa tồn tại, đang xóa và clone mới ---"
              rm -rf joblyai
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git joblyai
            fi
            
            # 4. Vào thư mục và cập nhật code
            cd joblyai
            echo "--- Đang cập nhật mã nguồn ---"
            git fetch origin main
            git reset --hard origin/main
            
            # 5. Khôi phục file .env từ bản sao lưu (nếu có)
            if [ -f "$HOME/backend_env_backup" ]; then
              echo "--- Đang khôi phục file .env ---"
              mkdir -p apps/backend
              mv "$HOME/backend_env_backup" apps/backend/.env
            fi
            
            # 6. Kiểm tra file .env (Bắt buộc phải có để chạy Docker)
            if [ ! -f "apps/backend/.env" ]; then
              echo "LỖI: Không tìm thấy file apps/backend/.env! Hãy tạo nó thủ công trên EC2."
              exit 1
            fi
            
            # 7. Đảm bảo docker-compose hoạt động
            DOCKER_COMPOSE_CMD="docker-compose"
            if ! command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE_CMD="docker compose"
            fi
            
            # 8. Chạy Docker Compose
            echo "--- Đang khởi động hệ thống ---"
            $DOCKER_COMPOSE_CMD -f docker-compose.yml up -d --build backend nginx redis scylla scylla-init
            
            # 9. Dọn dẹp RAM
            docker image prune -f
            
            # 10. Database Migration
            $DOCKER_COMPOSE_CMD exec -T backend npx prisma migrate deploy
