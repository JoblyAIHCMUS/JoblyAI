name: Deploy Backend JoblyAI to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            # 1. Chuyển về thư mục home để đảm bảo đường dẫn
            cd $HOME

            # 2. Xóa và Clone lại nếu thư mục bị lỗi hoặc không có .git
            if [ ! -d "joblyai/.git" ]; then
              echo "--- Thư mục lỗi hoặc chưa tồn tại, đang xóa và clone mới ---"
              rm -rf joblyai
              # Sử dụng token để clone (vượt qua lỗi Private repo)
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git joblyai
            fi

            # 3. Vào thư mục và cập nhật code
            cd joblyai
            echo "--- Đang kéo code mới ---"
            git fetch origin main
            git reset --hard origin/main

            # 4. Kiểm tra sự tồn tại của file cấu hình
            if [ ! -f "docker-compose.yml" ]; then
              echo "LỖI: Không tìm thấy file docker-compose.yml!"
              exit 1
            fi

            # 5. Đảm bảo docker-compose hoạt động (Fix Status 127)
            DOCKER_COMPOSE_CMD="docker-compose"
            if ! command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE_CMD="docker compose"
            fi

            # 6. Chạy môi trường Production
            echo "--- Đang build và chạy Docker ---"
            $DOCKER_COMPOSE_CMD -f docker-compose.yml up -d --build backend nginx redis scylla scylla-init

            # 7. Dọn dẹp RAM
            docker image prune -f

            # 8. Database Migration
            $DOCKER_COMPOSE_CMD exec -T backend npx prisma migrate deploy
