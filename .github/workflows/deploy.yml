name: Deploy Backend JoblyAI to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            # 1. Change to home directory
            cd $HOME
            
            # 2. Backup .env file if it exists to prevent loss during directory deletion
            if [ -f "joblyai/apps/backend/.env" ]; then
              echo "--- Backing up .env file ---"
              cp "joblyai/apps/backend/.env" "$HOME/backend_env_backup"
            fi
            
            # 3. Delete and Re-clone if directory is corrupted or .git is missing
            if [ ! -d "joblyai/.git" ]; then
              echo "--- Corrupted or missing directory, deleting and cloning fresh ---"
              rm -rf joblyai
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git joblyai
            fi
            
            # 4. Enter directory and update source code
            cd joblyai
            echo "--- Updating source code ---"
            git fetch origin main
            git reset --hard origin/main
            
            # 5. Restore .env file from backup (if exists)
            if [ -f "$HOME/backend_env_backup" ]; then
              echo "--- Restoring .env file ---"
              mkdir -p apps/backend
              mv "$HOME/backend_env_backup" apps/backend/.env
            fi
            
            # 6. Check for .env file (Required for Docker)
            if [ ! -f "apps/backend/.env" ]; then
              echo "ERROR: apps/backend/.env file not found! Please create it manually on EC2."
              exit 1
            fi
            
            # 7. Ensure docker-compose is available (Fix Status 127)
            DOCKER_COMPOSE_CMD="docker-compose"
            if ! command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE_CMD="docker compose"
            fi
            
            # 8. Run Docker Compose
            echo "--- Starting the system ---"
            $DOCKER_COMPOSE_CMD -f docker-compose.yml up -d --build backend nginx redis scylla scylla-init
            
            # 9. Cleanup RAM (prune unused images)
            docker image prune -f
            
            # 10. Database Migration
            $DOCKER_COMPOSE_CMD exec -T backend npx prisma migrate deploy
