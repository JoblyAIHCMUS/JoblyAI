name: Deploy Backend JoblyAI to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            # 1. Change to home directory
            cd $HOME
            
            # 2. Backup .env file if it exists to prevent loss during directory deletion
            if [ -f "joblyai/apps/backend/.env" ]; then
              echo "--- Backing up .env file ---"
              cp "joblyai/apps/backend/.env" "$HOME/backend_env_backup"
            fi
            
            # 3. Delete and Re-clone if directory is corrupted or .git is missing
            if [ ! -d "joblyai/.git" ]; then
              echo "--- Corrupted or missing directory, deleting and cloning fresh ---"
              rm -rf joblyai
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git joblyai
            fi
            
            # 4. Enter directory and update source code
            cd joblyai
            echo "--- Updating source code ---"
            git fetch origin main
            git reset --hard origin/main
            
            # 5. Restore .env file from backup (if exists)
            if [ -f "$HOME/backend_env_backup" ]; then
              echo "--- Restoring .env file ---"
              mkdir -p apps/backend
              mv "$HOME/backend_env_backup" apps/backend/.env
            fi
            
            # 6. Check for .env file (Required for Docker)
            if [ ! -f "apps/backend/.env" ]; then
              echo "ERROR: apps/backend/.env file not found! Please create it manually on EC2."
              exit 1
            fi
            
            # 7. Ensure docker-compose is available
            DOCKER_COMPOSE_CMD="docker-compose"
            if ! command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE_CMD="docker compose"
            fi
            
            # 8. Super-Sequential Startup for Maximum RAM Efficiency
            echo "--- [1/5] Stopping all services to free memory ---"
            $DOCKER_COMPOSE_CMD down --remove-orphans
            docker system prune -a -f # Deep cleanup
            
            echo "--- [2/5] Building Backend image in isolation ---"
            $DOCKER_COMPOSE_CMD build backend
            
            echo "--- [3/5] Starting Infrastructure (Redis, Scylla) ---"
            $DOCKER_COMPOSE_CMD up -d redis scylla
            
            echo "--- [4/5] Waiting for Infrastructure to be healthy ---"
            # Wait until Scylla is ready (max 2 minutes)
            for i in {1..24}; do
              if docker ps | grep scylla_jobly | grep -q "(healthy)"; then
                echo "Infrastructure is healthy!"
                break
              fi
              echo "Waiting for Scylla... ($((i*5))s)"
              sleep 5
            done
            
            echo "--- [5/5] Starting Application (Backend, Nginx) ---"
            $DOCKER_COMPOSE_CMD up -d backend nginx scylla-init
            
            # 9. Final check
            docker ps
            
            # 10. Database Migration
            echo "--- Running Database Migrations ---"
            sleep 5
            $DOCKER_COMPOSE_CMD exec -T backend npx prisma migrate deploy
