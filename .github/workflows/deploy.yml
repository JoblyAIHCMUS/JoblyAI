name: Deploy Fullstack JoblyAI to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            # Enable immediate exit on any error
            set -e
            
            # 1. Change to home directory
            cd $HOME
            
            # 2. Backup .env file if it exists
            if [ -f "joblyai/apps/backend/.env" ]; then
              echo "--- Backing up .env file ---"
              cp "joblyai/apps/backend/.env" "$HOME/backend_env_backup"
            fi
            
            # 3. Clean and Clone if needed
            if [ ! -d "joblyai/.git" ]; then
              echo "--- Corrupted or missing directory, re-cloning ---"
              rm -rf joblyai
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git joblyai
            fi
            
            # 4. Update source code
            cd joblyai
            echo "--- Updating source code ---"
            git fetch origin main
            git reset --hard origin/main
            
            # 5. Restore .env file
            if [ -f "$HOME/backend_env_backup" ]; then
              echo "--- Restoring .env file ---"
              mkdir -p apps/backend
              mv "$HOME/backend_env_backup" apps/backend/.env
            fi
            
            # 6. Ensure docker-compose is available
            DOCKER_COMPOSE_CMD="docker-compose"
            if ! command -v docker-compose &> /dev/null; then
                DOCKER_COMPOSE_CMD="docker compose"
            fi
            
            # 7. SUPER-SEQUENTIAL DEPLOYMENT (Low RAM Optimization)
            # Function to print logs on failure
            function print_logs_and_exit {
                echo "--- DEPLOYMENT FAILED! Printing container logs ---"
                $DOCKER_COMPOSE_CMD logs --tail=100 backend
                $DOCKER_COMPOSE_CMD logs --tail=100 web
                exit 1
            }
            
            trap print_logs_and_exit ERR

            echo "--- [1/6] Stopping services ---"
            $DOCKER_COMPOSE_CMD down --remove-orphans
            docker system prune -a -f
            
            echo "--- [2/6] Building Backend ---"
            $DOCKER_COMPOSE_CMD build backend
            
            echo "--- [3/6] Building Frontend ---"
            $DOCKER_COMPOSE_CMD build web
            
            echo "--- [4/6] Starting Infrastructure (Redis, Scylla) ---"
            $DOCKER_COMPOSE_CMD up -d redis scylla
            
            echo "--- [5/6] Waiting for Infrastructure to be healthy ---"
            for i in {1..24}; do
              if docker ps | grep scylla_jobly | grep -q "(healthy)"; then
                echo "Infrastructure is healthy!"
                break
              fi
              echo "Waiting for Scylla... ($((i*5))s)"
              sleep 5
            done
            
            echo "--- [6/6] Starting Apps (Web, Backend, Nginx) ---"
            $DOCKER_COMPOSE_CMD up -d web backend nginx scylla-init
            
            # 8. Wait for Backend healthy before Migration
            echo "--- Waiting for Backend to be healthy ---"
            for i in {1..24}; do
              if docker ps | grep backend_jobly | grep -q "(healthy)"; then
                echo "Backend is healthy!"
                break
              fi
              # Check if container died
              if ! docker ps | grep -q backend_jobly; then
                echo "ERROR: Backend container died unexpectedly!"
                $DOCKER_COMPOSE_CMD logs backend
                exit 1
              fi
              echo "Waiting for Backend... ($((i*5))s)"
              sleep 5
            done
            
            # 9. Database Migration
            echo "--- Running Database Migrations ---"
            if [ -f "apps/backend/.env" ]; then
                DB_URL=$(grep "^DATABASE_URL=" apps/backend/.env | head -1 | sed 's/DATABASE_URL=//' | sed 's/"//g' | sed "s/'//g")
                $DOCKER_COMPOSE_CMD exec -T -e DATABASE_URL="$DB_URL" backend npx prisma@6.19.3 migrate deploy --schema apps/backend/prisma/schema.prisma
            else
                echo "ERROR: apps/backend/.env not found."
                exit 1
            fi
            
            echo "--- DEPLOYMENT COMPLETED SUCCESSFULLY ---"
            docker ps
