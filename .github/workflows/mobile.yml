name: Mobile Android/iOS CI/CD Pipeline

on:
  push:
    branches:
      - '**/android/**'
      - '**/ios/**'
      - '**/mobile/**'
      - '**/infrastructure/**'
    paths:
      - 'apps/mobile/**'
      - 'libs/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches:
      - '**/android/**'
      - '**/ios/**'
      - '**/mobile/**'
      - '**/infrastructure/**'
    paths:
      - 'apps/mobile/**'
      - 'libs/**'
      - '.github/workflows/mobile.yml'

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  # JOB 1: CI Checks (Formatting, audit, lint)
  validate-mobile:
    if: >-
      ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')) &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -d node_modules/react-native-safe-area-context
      # 3a. Run format check
      - run: pnpm nx format:check --base=origin/main --head=HEAD
      # 3b. Package audit
      - run: pnpm audit --audit-level=high
      # 4. Run mobile lint
      - run: pnpm nx run @jobly/mobile:lint

  # JOB 2: Smoke Test (Metro bundler)
  smoke-mobile:
    needs: validate-mobile
    if: >-
      ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')) &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -d node_modules/react-native-safe-area-context
      # 4. Start Metro bundler
      - name: Start Metro bundler
        run: nohup pnpm nx start @jobly/mobile > /tmp/metro.log 2>&1 &
      # 5. Smoke check Metro
      - name: Smoke check Metro
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"; then
              echo "Metro healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Metro did not become healthy"
          cat /tmp/metro.log
          exit 1

  # JOB 3: CD (Android APK release artifact)
  build-android:
    needs: [validate-mobile, smoke-mobile]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Link workspace node_modules
        run: |
          if [ ! -e apps/mobile/node_modules ]; then
            ln -s "$GITHUB_WORKSPACE/node_modules" apps/mobile/node_modules
          fi
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -f node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      # 3a. Ensure Hermes CLI can execute on Linux runners
      - name: Install Hermes Linux runtime libs
        run: sudo apt-get update && sudo apt-get install -y libc++1 libc++abi1 libstdc++6 libncurses5 libtinfo5 libunwind8
      - name: Ensure Hermes compiler is executable
        run: |
          # Resolve the actual physical path through PNPM's symlinks
          REAL_HERMES_PATH=$(readlink -f node_modules/react-native/sdks/hermesc/linux64-bin/hermesc)
          echo "Real Hermes path is: $REAL_HERMES_PATH"
          chmod +x "$REAL_HERMES_PATH"
      - name: Hermes diagnostics
        run: |
          set -euo pipefail
          HERMES_PATH=$(readlink -f node_modules/react-native/sdks/hermesc/linux64-bin/hermesc)
          ls -l "$HERMES_PATH"
          file "$HERMES_PATH"
          ldd "$HERMES_PATH" || true
      # 4. Set up Java for Android builds
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # 5. Build the Android release APK
      - name: Build Android release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew clean
          ./gradlew assembleRelease --no-build-cache
      # 6. Upload Android artifact
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-release
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
