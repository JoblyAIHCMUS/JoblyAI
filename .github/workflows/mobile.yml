name: Mobile Expo CI/CD Pipeline

on:
  push:
    branches:
      - '*android*'
      - '*ios*'
      - '*mobile*'
      - '*infrastructure*'
      - 'development'
      - 'main'
    paths:
      - 'apps/mobile/**'
      - 'libs/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches:
      - '*android*'
      - '*ios*'
      - '*mobile*'
      - '*infrastructure*'
      - 'development'
      - 'main'
    paths:
      - 'apps/mobile/**'
      - 'libs/**'
      - '.github/workflows/mobile.yml'

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  # JOB 1: CI Checks (Formatting, audit, lint)
  validate-mobile:
    if: >-
      ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')) &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -d node_modules/react-native-safe-area-context
      # 3a. Run format check
      - run: pnpm nx format:check --base=origin/main --head=HEAD
      # 3b. Package audit (pnpm 10's built-in audit hits the retired npm
      # /security/audits endpoint, so we use the OSV-based script in package.json)
      - run: pnpm run audit --audit-level=high --prod
      # 4. Run mobile lint
      - run: pnpm nx run @jobly/mobile:lint

  # JOB 2: Smoke Test (Expo prebuild)
  smoke-mobile:
    needs: validate-mobile
    if: >-
      ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')) &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -d node_modules/react-native-safe-area-context
      # 4. Smoke check Expo native config
      - name: Smoke check Expo prebuild
        run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: apps/mobile

  # JOB 3: Build Android (Expo prebuild)
  build-android:
    needs: validate-mobile
    if: >-
      ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')) &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -d node_modules/react-native-safe-area-context
      # 4. Generate Android native code
      - name: Prebuild Android
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: apps/mobile

  # JOB 4: Build iOS (Expo prebuild)
  build-ios:
    needs: validate-mobile
    if: >-
      ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')) &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Setup PNPM
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # 2. Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # 3. Install Ruby (for CocoaPods)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0
          bundler-cache: true
      # 4. Install CocoaPods
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version
      # 5. Install Dependencies
      - run: pnpm install --frozen-lockfile
      - name: Verify React Native node modules
        run: |
          test -d node_modules/react-native
          test -d node_modules/react-native-safe-area-context
      # 6. Generate iOS native code
      - name: Prebuild iOS
        run: pnpm exec expo prebuild --platform ios
        working-directory: apps/mobile
