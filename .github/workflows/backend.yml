name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
      - '**/backend/**'
    paths:
      - 'apps/backend/**'
      - 'libs/**'
  pull_request:
    branches:
      - main
      - development
      - '**/backend/**'
    paths:
      - 'apps/backend/**'
      - 'libs/**'

permissions:
  actions: read
  contents: read
  packages: write # Required for pushing to GitHub Container Registry

jobs:
  # JOB 1: CI Checks (Lint, Test, Build)
  build-backend:
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip CI]') &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Setup PNPM (Version 9 required)
      - uses: pnpm/action-setup@v2
        with:
          version: 9

      # 2. Setup Node (Version 22 required)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile
      # 3a. Run format check
      - run: pnpm nx format:check --base=origin/development --head=HEAD
      # 3b. Package audit
      - run: pnpm audit --audit-level=high

      # 4. Initialize Nx
      - uses: nrwl/nx-set-shas@v4

      # 5. Run Checks (Only on affected projects)
      - run: pnpm nx affected -t lint test build

      # 6. Enforce coverage quality gate for backend
      - name: Check if backend is affected
        id: backend_check
        run: |
          if pnpm nx show projects --affected | grep -q "@jobly/backend"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      # 7. Upload Vitest Coverage Report
      - name: Upload Vitest Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-coverage
          path: apps/backend/coverage

      # 8. Archive Vitest Coverage Report
      - name: Archive Vitest Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-coverage-archive
          path: apps/backend/coverage/**/*

  # JOB 2: Smoke Test (Docker + Health Check)
  smoke-backend:
    needs: build-backend
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip CI]') &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start backend with Docker Compose
        run: |
          cp apps/backend/.env.example apps/backend/.env
          docker compose -f docker-compose.yml up -d postgres redis backend
          echo "Waiting for services to initialize..."
          sleep 5
          echo "=== Docker Compose Status ==="
          docker compose -f docker-compose.yml ps

      - name: Smoke check API
        run: |
          echo "Waiting for backend to start..."
          for i in {1..120}; do
            if curl -fsS http://localhost:3000/api >/dev/null 2>&1; then
              echo "✓ Backend healthy"
              exit 0
            fi
            echo "Attempt $i/120: Backend not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "✗ Backend did not become healthy after 120 seconds"
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.yml logs backend || true
          echo "=== Docker Processes ==="
          docker compose -f docker-compose.yml ps || true
          exit 1

  # JOB 3: CD (Build & Push Docker)
  deploy-backend:
    needs: [build-backend, smoke-backend]
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
           !contains(github.event.head_commit.message, '[skip CI]') &&
           (github.event_name != 'pull_request' ||
             (!contains(github.event.pull_request.title, '[skip CI]') &&
              !contains(github.event.pull_request.body, '[skip CI]'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Package audit
      - run: pnpm audit --audit-level=high
      - uses: nrwl/nx-set-shas@v4

      # Check if backend was modified
      - name: Check if backend is affected
        id: check
        run: |
          if pnpm nx show projects --affected | grep -q "@jobly/backend"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      # SAFETY STEP: Lowercase the repo owner name for Docker
      - name: Lowercase Repo Owner
        if: steps.check.outputs.affected == 'true'
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      # Docker Setup
      - name: Set up QEMU
        if: steps.check.outputs.affected == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.affected == 'true'
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        if: steps.check.outputs.affected == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push
      - name: Build and push
        if: steps.check.outputs.affected == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          # Uses the lowercased environment variable we created above
          tags: ghcr.io/${{ env.REPO_OWNER }}/jobly-backend:latest
