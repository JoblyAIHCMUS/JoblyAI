name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
      - "**/backend/**"
    paths: 
      - 'apps/backend/**'
      - 'libs/**'
  pull_request:
    branches:
      - main
      - development
      - "**/backend/**"
    paths: 
      - 'apps/backend/**'
      - 'libs/**'

permissions:
  actions: read
  contents: read
  packages: write # Required for pushing to GitHub Container Registry

jobs:
  # JOB 1: CI Checks (Lint, Test, Build)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Setup PNPM (Version 9 required)
      - uses: pnpm/action-setup@v2
        with:
          version: 9

      # 2. Setup Node (Version 22 required)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 3. Install Dependencies
      - run: pnpm install --frozen-lockfile

      # 4. Initialize Nx
      - uses: nrwl/nx-set-shas@v4

      # 5. Run Checks (Only on affected projects)
      - run: pnpm nx affected -t lint test build

  # JOB 2: CD (Build & Push Docker)
  deploy-backend:
    needs: build-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      # Check if backend was modified
      - name: Check if backend is affected
        id: check
        run: |
          if pnpm nx show projects --affected | grep -q "@jobly/backend"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
          fi

      # SAFETY STEP: Lowercase the repo owner name for Docker
      - name: Lowercase Repo Owner
        if: steps.check.outputs.affected == 'true'
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      # Docker Setup
      - name: Set up QEMU
        if: steps.check.outputs.affected == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.affected == 'true'
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        if: steps.check.outputs.affected == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push
      - name: Build and push
        if: steps.check.outputs.affected == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          # Uses the lowercased environment variable we created above
          tags: ghcr.io/${{ env.REPO_OWNER }}/jobly-backend:latest